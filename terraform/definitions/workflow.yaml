main:
    params: [event]
    steps:
        - init:
            assign:
            - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
            - encoding_id: '${"encoding-" + sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}'
            - docker_repo_uri: ${sys.get_env("DOCKER_REPO_URI")}
            - image_version: "encoder:v0.1"
            - base64: ${base64.decode(event.data.message.data)}
            - message: ${json.decode(base64)}
            - event_id: ${message.eventId}
            - bucket_name_primary: '${(project_id) + "-" + (event_id) + "-primary"}'
            - bucket_name_backup:  '${(project_id) + "-" + (event_id) + "-backup"}'
            - location_primary: ${message.region_primary}
            - location_backup: ${message.region_backup}
            - port_primary: ${message.port_primary}
            - port_backup: ${message.port_backup}
            - gke_cluster_name_primary: '${(sys.get_env("GKE_NAME")) + "-" + (location_primary)}'
            - gke_cluster_name_backup: '${(sys.get_env("GKE_NAME")) + "-" + (location_backup)}'
        - parallel_deployment:
            parallel:
                branches:
                - primary:
                    steps:
                    - create_bucket_primary:
                        call: googleapis.storage.v1.buckets.insert
                        args:
                            project: ${project_id}
                            body:
                                name: ${bucket_name_primary}
                                location: ${location_primary}
                                hierarchicalNamespace:
                                  enabled: true
                                # It's highly recommended to also enable Uniform Bucket-Level Access
                                iamConfiguration:
                                  uniformBucketLevelAccess:
                                    enabled: true
                    - label_bucket_primary:
                        call: googleapis.storage.v1.buckets.update
                        args:
                            bucket: ${bucket_name_primary}
                            body:
                                labels:
                                    event: ${event_id}
                                    backup: "false"
                    - run_encoder_primary:
                        call: gke.request
                        args:
                            project: ${project_id}
                            location: ${location_primary}
                            cluster_id: ${gke_cluster_name_primary}
                            method: "POST"
                            path: "/apis/apps/v1/namespaces/encoder-ns/deployments"
                            body:
                                kind: Deployment
                                metadata:
                                  name: '${(event_id) + "-primary"}'
                                  labels:
                                    name: encoder
                                    version: stable
                                    backup: "false"
                                    event: ${event_id}
                                spec:
                                  replicas: 1
                                  selector:
                                    matchLabels:
                                      event: ${event_id}
                                  template:
                                    metadata:
                                      labels:
                                        name: encoder
                                        version: stable
                                        backup: "false"
                                        event: ${event_id}
                                      annotations:
                                        gke-gcsfuse/volumes: "true"
                                        gke-gcsfuse/ephemeral-storage-limit: "0"
                                        gke-gcsfuse/cpu-limit: "0"
                                        gke-gcsfuse/memory-limit: "0"
                                        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
                                    spec:
                                      restartPolicy: Always
                                      serviceAccountName: ksa-wi-encoder
                                      terminationGracePeriodSeconds: 15
                                      nodeSelector:
                                        cloud.google.com/machine-family: n2d
                                        cloud.google.com/compute-class: Performance
                                        # cloud.google.com/gke-spot: "true"
                                      containers:
                                      - image: '${(docker_repo_uri) + "/" + (image_version)}'
                                        name: encoder
                                        imagePullPolicy: Always
                                        ports:
                                        - name: udp
                                          containerPort: 5001
                                          protocol: UDP
                                        env:
                                        - name: ENV
                                          value: dev
                                        - name: SENDER_ADDR
                                          value: '${(message.truckOriginIp) + ":" + (port_primary)}'
                                        - name: EVENT_ID
                                          value: '${event_id}'
                                        resources:
                                          requests:
                                            cpu: 6
                                            memory: 6Gi
                                            ephemeral-storage: 100Gi
                                          limits:
                                            memory: 16Gi
                                            ephemeral-storage: 100Gi
                                        volumeMounts:
                                        - name: gcs-fuse-csi-output
                                          mountPath: "/output"
                                      volumes:
                                      - name: gcs-fuse-cache
                                        emptyDir:
                                          medium: Memory
                                      - name: gcs-fuse-csi-output
                                        csi:
                                          driver: gcsfuse.csi.storage.gke.io
                                          volumeAttributes:
                                            bucketName: ${bucket_name_primary}
                                            mountOptions: "implicit-dirs,write:enable-streaming-writes:true"
                - backup:
                    steps:
                    - create_bucket_backup:
                        call: googleapis.storage.v1.buckets.insert
                        args:
                            project: ${project_id}
                            body:
                                name: ${bucket_name_backup}
                                location: ${location_backup}
                                hierarchicalNamespace:
                                  enabled: true
                                # It's highly recommended to also enable Uniform Bucket-Level Access
                                iamConfiguration:
                                  uniformBucketLevelAccess:
                                    enabled: true
                    - label_bucket_backup:
                        call: googleapis.storage.v1.buckets.update
                        args:
                            bucket: ${bucket_name_backup}
                            body:
                                labels:
                                    event: ${event_id}
                                    backup: "true"
                    - run_encoder_backup:
                        call: gke.request
                        args:
                            project: ${project_id}
                            location: ${location_backup}
                            cluster_id: ${gke_cluster_name_backup}
                            method: "POST"
                            path: "/apis/apps/v1/namespaces/encoder-ns/deployments"
                            body:
                                kind: Deployment
                                metadata:
                                  name: '${(event_id) + "-backup"}'
                                  labels:
                                    name: encoder
                                    version: stable
                                    backup: "true"
                                    event: ${event_id}
                                spec:
                                  replicas: 1
                                  selector:
                                    matchLabels:
                                      event: ${event_id}
                                  template:
                                    metadata:
                                      labels:
                                        name: encoder
                                        version: stable
                                        backup: "true"
                                        event: ${event_id}
                                      annotations:
                                        gke-gcsfuse/volumes: "true"
                                        gke-gcsfuse/ephemeral-storage-limit: "0"
                                        gke-gcsfuse/cpu-limit: "0"
                                        gke-gcsfuse/memory-limit: "0"
                                        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
                                    spec:
                                      restartPolicy: Always
                                      serviceAccountName: ksa-wi-encoder
                                      terminationGracePeriodSeconds: 15
                                      nodeSelector:
                                        cloud.google.com/machine-family: n2d
                                        cloud.google.com/compute-class: Performance
                                        # cloud.google.com/gke-spot: "true"
                                      containers:
                                      - image: '${(docker_repo_uri) + "/" + (image_version)}'
                                        name: encoder
                                        imagePullPolicy: Always
                                        ports:
                                        - name: udp
                                          containerPort: 5002
                                          protocol: UDP
                                        env:
                                        - name: ENV
                                          value: dev
                                        - name: SENDER_ADDR
                                          value: '${(message.truckOriginIp) + ":" + (port_backup)}'
                                        - name: EVENT_ID
                                          value: '${event_id}'
                                        resources:
                                          requests:
                                            cpu: 6
                                            memory: 6Gi
                                            ephemeral-storage: 100Gi
                                          limits:
                                            memory: 16Gi
                                            ephemeral-storage: 100Gi
                                        volumeMounts:
                                        - name: gcs-fuse-csi-output
                                          mountPath: "/output"
                                      volumes:
                                      - name: gcs-fuse-cache
                                        emptyDir:
                                          medium: Memory
                                      - name: gcs-fuse-csi-output
                                        csi:
                                          driver: gcsfuse.csi.storage.gke.io
                                          volumeAttributes:
                                            bucketName: ${bucket_name_backup}
                                            mountOptions: "implicit-dirs,write:enable-streaming-writes:true"
        - return_pubsub_message:
            return: ${message}
